server {
  listen 3000;
  server_name _;
  merge_slashes off;

  # OCI layers can be large. Stream them rather than buffering in the gateway.
  client_max_body_size 0;
  proxy_http_version 1.1;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  location / {
    proxy_pass http://forgejo:3000;
    proxy_set_header Connection $http_connection;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Full is an explicitly trusted LAN development hub. The gateway supplies
    # one fixed Forgejo identity, so Git and OCI clients never need a login.
    proxy_set_header X-WEBAUTH-USER hiveforge;
    proxy_set_header X-WEBAUTH-EMAIL hiveforge@trusted-lan.invalid;
    proxy_set_header Authorization "";
  }
}
